services:

  open_web_ui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_web_ui
    depends_on:
      - ollama
    networks:
      - project-network
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    depends_on:
      data-base:
        condition: service_healthy
    networks:
      - project-network
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - PASSWORD=${CODE_SERVER_PASSWORD}
      - DEFAULT_WORKSPACE=/config/workspace
    volumes:
      - ./code-server-config:/config
      - ./workspace:/config/workspace
    ports:
      - "8443:8443"
    networks:
      - project-network
    depends_on:
      - ollama
    restart: unless-stopped

  data-base:
    image: postgres:16.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - project-network
    volumes:
      - data-base-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  data-base-data:
  ollama-data:
    driver: local
  open-webui-data:
    driver: local

networks:
  project-network:
    driver: bridge

