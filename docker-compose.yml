services:

  interface:
    build:
      context: ./interface
      args:
        - REACT_APP_API_URL=http://localhost:5000
      dockerfile: Dockerfile
    container_name: interface
    networks:
      - project-network
    ports:
      - "3333:3000"
    depends_on:
      - agent
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: agent
    networks:
      - project-network
    ports:
      - "5000:5000"
    volumes:
      - ./agent:/agent
      - ./workspace:/workspace
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_HOST: data-base
      DB_PORT: 5432
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@data-base:5432/${DB_NAME}
      OLLAMA_HOST: http://ollama:11434
      WORKING_DIR: /workspace
      PYTHONUNBUFFERED: 1
    depends_on:
      data-base:
        condition: service_healthy
      ollama:
        condition: service_started
    working_dir: /agent
    command: uvicorn server:app --host 0.0.0.0 --port 5000
    restart: unless-stopped

#  open-webui:
#    image: ghcr.io/open-webui/open-webui:main
#    container_name: open-web-ui
#    networks:
#      - project-network
#    ports:
#      - "3030:8080"
#    volumes:
#      - ./openwebui-data:/app/backend/data
#    environment:
#      - OLLAMA_BASE_URL=http://ollama:11434
#      - WEBUI_AUTH=true
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
#    depends_on:
#      - ollama
#    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    depends_on:
      data-base:
        condition: service_healthy
    networks:
      - project-network
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  data-base:
    image: postgres:16.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - project-network
    volumes:
      - data-base-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  data-base-data:
  openwebui-data:
    driver: local
  ollama-data:
    driver: local

networks:
  project-network:
    driver: bridge

